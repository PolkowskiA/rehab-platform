services:
  backend:
    build:
      context: ./backend
      dockerfile: PatientRehabPanel.API/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/rehab.db
      - ASPNETCORE_ENVIRONMENT=Production
      - FRONTEND_ORIGINS=http://localhost:3001,http://localhost:5173
    volumes:
      - ./backend/PatientRehabPanel.API/rehab.db:/data/rehab.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:5000"
    ports:
      - "3001:80"
    depends_on:
      - backend
